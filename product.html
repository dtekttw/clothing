<!DOCTYPE html>
<html>
<head>
    <title>Product - DTekWear</title>

    <style>
        body{
            font-family:Arial;
            margin:0;
            background:#f5f5f5;
        }

        .container{
            display:flex;
            justify-content:center;
            padding:50px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:12px;
            width:400px;
            text-align:center;
            box-shadow:0 0 12px rgba(0,0,0,0.15);
        }

        img{
            width:100%;
            border-radius:10px;
        }

        button{
            margin-top:15px;
            padding:12px 20px;
            background:black;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="box">
        <img id="img" src="">
        <h2 id="name"></h2>
        <p id="price"></p>

        <button onclick="addToCart()">Add to Cart 🛒</button>
    </div>
</div>

<script>
    const products = {
        hoodie: {name:"DTek Hoodie", price:15000, img:"https://via.placeholder.com/400x500"},
        tee: {name:"DTee", price:8000, img:"https://via.placeholder.com/400x500"},
        oversized: {name:"Oversized DTee", price:10000, img:"https://via.placeholder.com/400x500"}
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const product = products[id];

    document.getElementById("img").src = product.img;
    document.getElementById("name").innerText = product.name;
    document.getElementById("price").innerText = "₦" + product.price;

    function addToCart(){
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.push(product);
        localStorage.setItem("cart", JSON.stringify(cart));
        alert("Added to cart!");
    }
</script>

</body>
</html>
