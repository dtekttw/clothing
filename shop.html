<!DOCTYPE html>
<html>
<head>
    <title>Shop - DTekWear</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        header{
            background:black;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#111;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        .products{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
            padding:60px;
        }

        /* 🔥 LONG VERTICAL CARDS */
        .card{
            background:white;
            width:280px;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 0 12px rgba(0,0,0,0.15);
            transition:0.3s;
            cursor:pointer;
        }

        .card:hover{
            transform:scale(1.05);
        }

        .card img{
            width:100%;
            height:350px;
            object-fit:cover;
        }

        .card-content{
            padding:20px;
            text-align:center;
        }

        footer{
            background:black;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:auto;
        }
    </style>
</head>

<body>

<header>
    <h1>Shop DTekWear</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart 🛒</a>
</nav>

<section class="products">

    <div class="card" onclick="openProduct('hoodie')">
        <img src="images/hoodie.jpg">
        <div class="card-content">
            <h3>DTek Hoodie</h3>
            <p>₦15,000</p>
        </div>
    </div>

    <div class="card" onclick="openProduct('tee')">
        <img src="images/tee.jpg">
        <div class="card-content">
            <h3>DTee</h3>
            <p>₦8,000</p>
        </div>
    </div>

    <div class="card" onclick="openProduct('oversized')">
        <img src="images/oversized.jpg">
        <div class="card-content">
            <h3>Oversized DTee</h3>
            <p>₦10,000</p>
        </div>
    </div>

</section>

<footer>
    <p>© 2026 DTekWear</p>
</footer>

<script>
    function openProduct(id){
        window.location.href = "product.html?id=" + id;
    }
</script>

</body>
</html>
