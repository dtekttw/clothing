<!DOCTYPE html>
<html>
<head>
    <title>Shop - DTekWear</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        header{
            background:black;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#111;
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-weight:bold;
        }

        .products{
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
            padding:60px;
        }

        .card{
            background:white;
            width:320px;
            padding:25px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 0 12px rgba(0,0,0,0.15);
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.05);
        }

        .card img{
            width:100%;
            border-radius:10px;
        }

        footer{
            background:black;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:auto; /* THIS keeps it at bottom */
        }
    </style>
</head>

<body>

<header>
    <h1>Shop DTekWear</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="#">Contact</a>
</nav>

<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/400">
        <h3>DTek Hoodie</h3>
        <p>₦15,000</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400">
        <h3>DTee</h3>
        <p>₦8,000</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400">
        <h3>Oversized DTee</h3>
        <p>₦10,000</p>
    </div>

</section>

<footer>
    <p>© 2026 DTekWear</p>
</footer>

</body>
</html>
