<!DOCTYPE html>
<html>
<head>
    <title>Cart - DTekWear</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
        }

        .container{
            padding:40px;
        }

        .item{
            background:white;
            padding:15px;
            margin-bottom:10px;
            border-radius:10px;
        }

        button{
            margin-top:20px;
            padding:12px;
            background:black;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Your Cart 🛒</h1>

    <div id="cart"></div>

    <h2 id="total"></h2>

    <button onclick="clearCart()">Clear Cart</button>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cart");
    let total = 0;

    cart.forEach(item => {
        total += item.price;

        container.innerHTML += `
            <div class="item">
                <h3>${item.name}</h3>
                <p>₦${item.price}</p>
            </div>
        `;
    });

    document.getElementById("total").innerText = "Total: ₦" + total;

    function clearCart(){
        localStorage.removeItem("cart");
        location.reload();
    }
</script>

</body>
</html>
